[build-system]
requires = ["setuptools>=77"]  # 77+ understands the SPDX `license` expression
build-backend = "setuptools.build_meta"

[project]
name = "crypto-auction"
version = "0.1.0"
description = "Sealed-bid auction demo with Pedersen commitments and zero-knowledge range proofs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# Runtime dependencies, declared only here (requirements.txt installs the
# project). Compatible-release pins accept patch fixes only; minor upgrades
# are a deliberate change.
dependencies = [
    "ecdsa~=0.19.2",  # pure-Python secp256k1 arithmetic for Pedersen commitments
    "flask~=3.1.3",
]

# src layout: the package is only importable once installed, so tests run
# against the installed code rather than whatever happens to be on sys.path.
[tool.setuptools.packages.find]
where = ["src"]

# The page and its assets ship inside the package, so an installed copy can
# serve them.
[tool.setuptools.package-data]
"crypto_auction.web" = ["templates/*.html", "static/*.js", "static/*.css"]

[tool.mypy]
files = ["src", "examples"]
strict = true
# Use the pure-Python parser: the optional native parser is a separate compiled
# binary, which Windows Smart App Control can refuse to load.
native_parser = false

[[tool.mypy.overrides]]
# ecdsa ships without type hints; its points are treated as Any.
module = ["ecdsa", "ecdsa.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"  # oldest Python in the CI matrix

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "B",       # flake8-bugbear: likely bugs
    "UP",      # pyupgrade: modern syntax for the target version
    "SIM",     # flake8-simplify
    "C4",      # flake8-comprehensions
    "S",       # flake8-bandit: security smells, relevant for a crypto project
    "RUF",     # ruff-specific checks
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
# An xfail test that starts passing must fail the run, so a fixed bug
# cannot hide behind a stale known-bug marker.
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
# Measure the project directory and the package rather than named modules, so
# a module no test imports is reported as 0% instead of silently dropped.
# `source` alone would not look inside src/, which has no __init__.py.
source = ["."]
source_pkgs = ["crypto_auction"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
# Floor, not a target: the lowest current total (92.2% on Python 3.14+, where
# coverage counts statements differently) minus headroom. Raise it as tests
# are added.
fail_under = 90
exclude_also = ['if __name__ == "__main__":']
