name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: no job needs more than read access to the repository.
permissions:
  contents: read

# A newer push to the same PR supersedes its running checks. Runs on main
# are never cancelled, so every commit keeps its own CI result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint, format and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Third-party actions are pinned to a full commit SHA (tags can be
      # moved); the comment records the release it corresponds to.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check --diff .

      # Strict mode over src/ and examples/; settings live in pyproject.toml.
      - name: Type check
        run: python -m mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Let every version finish, so one failure shows whether it is
      # version-specific.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      # tests/test_browser_interop.py runs the browser's crypto module under
      # Node to check the server accepts what the page produces.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Coverage settings and the minimum threshold live in pyproject.toml.
      # REQUIRE_NODE makes the interop tests fail rather than skip without Node.
      - name: Run tests with coverage
        env:
          REQUIRE_NODE: "1"
        run: >-
          pytest --cov
          --cov-report=term-missing
          --cov-report=markdown-append:"$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend lint, format and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      # Exactly what package-lock.json records; .npmrc keeps packages from
      # running install scripts.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Prettier: JavaScript, CSS, HTML, JSON and YAML (see .prettierignore).
      - name: Check formatting
        run: npm run format:check

      # Node's built-in test runner (the script in package.json).
      - name: Run frontend tests
        run: npm test

  e2e:
    name: End-to-end (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      # The server: the package and its runtime dependencies only.
      - name: Install the package
        run: pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The browser build this Playwright version is made for, and the system
      # libraries it needs.
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # Starts the server itself (playwright.config.js).
      - name: Run end-to-end tests
        run: npm run test:e2e -- --project=${{ matrix.browser }}

      # The report, and a trace of each failed test: download the artifact
      # and open a trace with `npx playwright show-trace <trace.zip>`.
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
